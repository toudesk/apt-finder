<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>내 아파트 찾기</title>
<meta name="theme-color" content="#2563eb" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icon-192.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="아파트찾기" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1a1d23; --sub: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --accent-soft: #eff4ff; --warn-bg: #fff7e6; --warn: #92580a;
    --gS: #7c3aed; --gS-bg: #f3edff; --gA: #059669; --gA-bg: #e7f8f1;
    --gB: #b45309; --gB-bg: #fdf3e2; --gC: #6b7280; --gC-bg: #f1f2f4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Noto Sans KR", system-ui, sans-serif; font-size: 15px; line-height: 1.5; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .lead { color: var(--sub); margin: 0 0 20px; }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .filters { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  label, .lbl { display: grid; gap: 4px; font-size: 13px; color: var(--sub); font-weight: 500; }
  select, input { font: inherit; padding: 9px 10px; border: 1px solid var(--line); border-radius: 9px;
    background: #fff; color: var(--text); width: 100%; }
  .gus { grid-column: 1 / -1; }
  .gu-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .gu-chips button { font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 99px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--text); }
  .gu-chips button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.go { grid-column: 1 / -1; font: inherit; font-weight: 700; padding: 12px; border: 0;
    border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
  button.go:disabled { opacity: .6; cursor: wait; }

  .notice { margin: 16px 0 0; padding: 10px 14px; border-radius: 10px; background: var(--warn-bg);
    color: var(--warn); font-size: 14px; }

  h2 { font-size: 17px; margin: 26px 0 10px; }
  .summary { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .sum { text-align: left; font: inherit; color: inherit; cursor: pointer; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .sum.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .sum .t { display: flex; justify-content: space-between; align-items: baseline; }
  .sum .t b { font-size: 16px; }
  .sum .t span { color: var(--sub); font-size: 13px; }
  .sum .rows { margin-top: 8px; font-size: 13px; display: grid; gap: 3px; }
  .sum .rows div { display: flex; justify-content: space-between; gap: 8px; }
  .dist { display: flex; gap: 3px; }
  .dist i { font-style: normal; font-size: 11px; padding: 0 5px; border-radius: 5px; }

  .tools { margin-top: 10px; display: grid; gap: 10px; }
  .tool-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--sub); }
  .tool-row select { width: auto; padding: 6px 8px; font-size: 13px; }
  details.weights summary { cursor: pointer; font-size: 13px; color: var(--accent); font-weight: 500; }
  .wgrid { display: grid; gap: 8px 16px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); margin-top: 10px; }
  .wgrid label { grid-template-columns: 1fr auto; align-items: center; }
  .wgrid input[type=range] { grid-column: 1 / -1; padding: 0; }
  .help { font-size: 12px; color: var(--sub); margin: 8px 0 0; }

  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin: 22px 0 10px; }
  .bar strong { font-size: 17px; }
  .bar select { width: auto; }

  .apt { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
  .apt-head { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; padding: 14px 16px; cursor: pointer; }
  .apt-head:hover { background: #fafbfc; }
  .score { width: 56px; text-align: center; }
  .score b { display: block; font-size: 24px; line-height: 1.1; }
  .score span { font-size: 11px; color: var(--sub); }
  .name { font-weight: 700; font-size: 16px; }
  .meta { color: var(--sub); font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
  .g { font-size: 12px; padding: 1px 7px; border-radius: 6px; font-weight: 500; white-space: nowrap; }
  .gS { background: var(--gS-bg); color: var(--gS); } .gA { background: var(--gA-bg); color: var(--gA); }
  .gB { background: var(--gB-bg); color: var(--gB); } .gC { background: var(--gC-bg); color: var(--gC); }
  .g- { background: #f6f7f9; color: #9ca3af; }
  .price { text-align: right; }
  .price b { font-size: 18px; display: block; }
  .price span { font-size: 12px; color: var(--sub); }
  .near { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 13px; color: var(--text); }
  .near .muted { color: var(--sub); }
  .near b { font-weight: 500; }
  .links { display: flex; gap: 8px; margin-top: 8px; }
  .links a { font-size: 12px; color: var(--accent); text-decoration: none; border: 1px solid var(--line);
    padding: 3px 9px; border-radius: 8px; background: #fff; }
  .deals { display: none; border-top: 1px solid var(--line); padding: 6px 16px 12px; }
  .apt.open .deals { display: block; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 7px 4px; text-align: left; border-bottom: 1px solid var(--line); }
  th { color: var(--sub); font-weight: 500; font-size: 12px; }
  td.r, th.r { text-align: right; }
  .breakdown { font-size: 13px; color: var(--sub); margin: 8px 0 4px; }
  .empty { text-align: center; color: var(--sub); padding: 40px 0; }
  footer { margin-top: 30px; font-size: 12px; color: var(--sub); }

  /* ---- 단지 표 (한 줄에 한 단지) ---- */
  .wrap { max-width: 1440px; }
  .listhead { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 22px 0 10px; }
  .listhead strong { font-size: 19px; }
  .fchip { font-size: 13px; background: var(--warn-bg); color: var(--warn); padding: 3px 10px; border-radius: 8px; }
  .fchip a { color: var(--warn); margin-left: 6px; }
  .listhead .hint { font-size: 13px; color: var(--sub); }
  .listhead select { width: auto; margin-left: auto; }
  .tbl { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .cols { display: grid; align-items: start; column-gap: 14px;
    grid-template-columns: 128px 64px minmax(190px, 1.6fr) 118px 40px 64px 64px 112px 112px 84px 118px minmax(108px, 1fr); }
  .thead { position: sticky; top: 0; z-index: 2; background: #fafbfc; border-bottom: 1px solid var(--line);
    padding: 10px 18px; font-size: 13px; color: var(--text); font-weight: 500; align-items: end; }
  .thead small { display: block; font-weight: 400; font-size: 11px; color: #9ca3af; }
  .row { border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row-main { padding: 16px 18px; cursor: pointer; }
  .row-main:hover { background: #fafbfc; }
  .cell { font-size: 13px; min-width: 0; }
  .cell .big { font-size: 16px; font-weight: 700; display: block; line-height: 1.35; }
  .cell .sm { font-size: 12px; color: var(--sub); display: block; }
  .cell .lbl { display: none; }
  .num { font-variant-numeric: tabular-nums; }
  .tr { text-align: right; }
  .pill { display: inline-flex; align-items: center; justify-content: center; min-width: 46px; height: 34px;
    padding: 0 8px; border-radius: 10px; font-size: 18px; font-weight: 700; }
  .pill.gS { background: var(--gS-bg); color: var(--gS); } .pill.gA { background: var(--gA-bg); color: var(--gA); }
  .pill.gB { background: var(--gB-bg); color: var(--gB); } .pill.gC, .pill.g- { background: var(--gC-bg); color: var(--gC); }
  .gradecol { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: center; }
  .glist { display: grid; gap: 4px; }
  .glist div { display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-size: 12px; color: var(--sub); }
  .gl { display: inline-flex; width: 22px; height: 22px; align-items: center; justify-content: center; border-radius: 6px;
    font-size: 12px; font-weight: 700; }
  .gl.gS { background: var(--gS); color: #fff; } .gl.gA { background: var(--gA); color: #fff; }
  .gl.gB { background: var(--gB-bg); color: var(--gB); } .gl.gC, .gl.g- { background: var(--gC-bg); color: var(--gC); }
  .totcol { text-align: center; }
  .totcol a { display: block; margin-top: 6px; font-size: 12px; color: var(--accent); }
  .row .name { font-size: 16px; }
  .row .links { margin-top: 6px; flex-wrap: wrap; gap: 4px; }
  .row .links a { padding: 2px 7px; }
  .sheet .links { flex-wrap: wrap; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: #1a1d23; color: #fff;
    padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: .2s; z-index: 60; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  .walk { color: var(--accent); }
  .line { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 5px;
    border-radius: 99px; color: #fff; font-size: 11px; font-weight: 700; margin: 3px 3px 1px 0; }
  .rides div { display: flex; justify-content: flex-end; gap: 6px; white-space: nowrap; }
  .rides b { min-width: 34px; text-align: right; }
  .rides .avg { color: var(--sub); font-size: 12px; }
  .row .deals { display: none; border-top: 1px dashed var(--line); padding: 6px 18px 14px; background: #fcfcfd; }
  .row.open .deals { display: block; }
  .muted { color: var(--sub); }
  .ask { color: var(--accent); }

  /* ---- 단지 보고서 ---- */
  .modal { position: fixed; inset: 0; background: rgba(15, 23, 42, .45); z-index: 50; display: flex;
    align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
  .sheet { background: #fff; border-radius: 16px; width: 100%; max-width: 760px; padding: 24px; position: relative; }
  .sheet h3 { margin: 0; font-size: 22px; }
  .sheet h4 { margin: 22px 0 8px; font-size: 15px; }
  .sheet .x { position: absolute; top: 14px; right: 14px; border: 0; background: #f1f2f4; width: 34px; height: 34px;
    border-radius: 10px; font-size: 18px; cursor: pointer; }
  .rgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .rbox { background: #f8f9fb; border-radius: 12px; padding: 12px; font-size: 13px; }
  .rbox .t { display: flex; justify-content: space-between; align-items: center; font-weight: 700; margin-bottom: 4px; }
  .spark { width: 100%; height: 150px; display: block; }

  @media (max-width: 1100px) {
    .thead { display: none; }
    .cols { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 12px; }
    .c-grade { grid-column: 1 / span 2; } .c-total { grid-column: 3; } .c-name { grid-column: 1 / -1; grid-row: 2; }
    .c-price { grid-column: 4; grid-row: 1; }
    .cell .lbl { display: block; font-size: 11px; color: #9ca3af; margin-bottom: 1px; }
    .c-count, .c-built, .c-hh, .c-station, .c-ride, .c-life, .c-density, .c-school { background: #f8f9fb; border-radius: 10px; padding: 8px 10px; }
    .tr { text-align: left; }
    .rides div { justify-content: space-between; max-width: 160px; }
    .glist div { justify-content: flex-start; }
    .gradecol { grid-template-columns: auto auto; justify-content: start; }
    .glist { grid-auto-flow: column; }
  }
  @media (max-width: 560px) {
    .cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .c-grade { grid-column: 1; } .c-total { grid-column: 2; text-align: left; } .c-price { grid-column: 1 / -1; grid-row: auto; }
    .glist { grid-auto-flow: row; }
    .sheet { padding: 18px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>내 아파트 찾기</h1>
  <p class="lead">구와 예산을 고르면 최근 실거래된 아파트를 단지별로 모아 점수와 등급을 매겨 드려요.</p>

  <form class="panel filters" id="f">
    <div class="lbl gus">구 (최대 3개)
      <div class="gu-chips" id="gus"></div>
    </div>
    <label>기간
      <select id="months">
        <option value="3">최근 3개월</option>
        <option value="6">최근 6개월</option>
        <option value="12">최근 1년</option>
      </select>
    </label>
    <label>최소 예산 (억)
      <input id="min" type="number" step="0.5" min="0" value="5" />
    </label>
    <label>최대 예산 (억)
      <input id="max" type="number" step="0.5" min="0" value="6" />
    </label>
    <label>크기 (전용면적)
      <select id="area">
        <option value="0">전체</option>
        <option value="39">39㎡ 이상 (16평형대~)</option>
        <option value="49">49㎡ 이상 (20평형대~)</option>
        <option value="59">59㎡ 이상 (24평형대~)</option>
        <option value="84">84㎡ 이상 (32평형대~)</option>
      </select>
    </label>
    <label>최소 세대수
      <select id="hh">
        <option value="0">상관없음</option>
        <option value="100">100세대 이상</option>
        <option value="300">300세대 이상</option>
        <option value="500">500세대 이상</option>
        <option value="1000">1,000세대 이상</option>
      </select>
    </label>
    <label>출근지 (최대 3곳, 쉼표로 구분)
      <input id="work" list="work-list" value="강남역, 시청역, 여의도역" placeholder="예: 강남역, 시청역, 여의도역" autocomplete="off" />
      <datalist id="work-list">
        <option value="강남역"></option><option value="시청역"></option><option value="여의도역"></option>
        <option value="광화문역"></option><option value="삼성역"></option><option value="종각역"></option>
        <option value="판교역"></option><option value="구로디지털단지역"></option><option value="마곡나루역"></option>
      </datalist>
    </label>
    <button class="go" id="go" type="submit">찾아보기</button>
  </form>

  <div id="notice"></div>
  <div id="summary"></div>
  <div id="tools"></div>
  <div id="result"></div>

  <footer>
    데이터: 국토교통부 아파트 매매 실거래가·공동주택 단지정보·건축물대장(공공데이터포털), 카카오맵(역·마트·백화점·중학교 위치, 대중교통 경로).
    취소된 거래는 뺐어요. 출근 시간은 조회한 시각 기준이라 실제 출근 시간대와 다를 수 있어요.
    점수와 등급은 이 앱이 정한 기준으로 계산한 참고용이에요. 실제 매물·가격·학교 배정은 꼭 직접 확인하세요.
  </footer>
</div>

<script>
const GU = [["종로구","11110"],["중구","11140"],["용산구","11170"],["성동구","11200"],["광진구","11215"],
  ["동대문구","11230"],["중랑구","11260"],["성북구","11290"],["강북구","11305"],["도봉구","11320"],
  ["노원구","11350"],["은평구","11380"],["서대문구","11410"],["마포구","11440"],["양천구","11470"],
  ["강서구","11500"],["구로구","11530"],["금천구","11545"],["영등포구","11560"],["동작구","11590"],
  ["관악구","11620"],["서초구","11650"],["강남구","11680"],["송파구","11710"],["강동구","11740"]];
const GU_NAME = Object.fromEntries(GU.map(([n, c]) => [c, n]));
const $ = (id) => document.getElementById(id);

// ---- 기억해 두는 설정 (이 브라우저에만 저장) ----
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// ---- 구 고르기 (최대 3개) ----
let picked = store.get("gus", ["11350"]);
function drawGus() {
  $("gus").innerHTML = GU.map(([n, c]) =>
    `<button type="button" data-c="${c}" class="${picked.includes(c) ? "on" : ""}">${n}</button>`).join("");
}
$("gus").addEventListener("click", (e) => {
  const c = e.target.dataset?.c; if (!c) return;
  if (picked.includes(c)) picked = picked.filter((x) => x !== c);
  else { picked.push(c); if (picked.length > 3) picked.shift(); }
  if (!picked.length) picked = [c];
  store.set("gus", picked); drawGus();
});
drawGus();

// ---- 점수 기준 ----
const CATS = [
  { k: "traffic", name: "교통", desc: "역까지 걷는 시간 + 출근 평균 시간(입력했을 때)" },
  { k: "life",    name: "생활", desc: "3km 안 큰 마트(8곳 만점)·백화점(3곳 만점) 수" },
  { k: "school",  name: "학군", desc: "가장 가까운 중학교까지 거리 (150m 만점 ~ 1km 0점)" },
  { k: "price",   name: "가격", desc: "같은 결과 안에서 평당 가격이 쌀수록 높음" },
  { k: "fresh",   name: "신축", desc: "준공 연차가 짧을수록 높음" },
  { k: "size",    name: "규모", desc: "세대수 (1,000세대 이상 만점 ~ 100세대 0점)" },
];
const W0 = { traffic: 3, life: 2, school: 2, price: 2, fresh: 1, size: 1 };
let weights = { ...W0, ...store.get("weights", {}) };
let gradeFilter = { traffic: 0, life: 0, school: 0 };  // 0=전체, 3=S만, 2=A이상, 1=B이상
let guFilter = null;
let sortBy = "score";

const clamp = (v) => Math.max(0, Math.min(100, v));
const lerp = (x, best, worst) => clamp(((worst - x) / (worst - best)) * 100); // best일 때 100, worst일 때 0
const year = new Date().getFullYear();

function scoreOf(g) {
  const p = g.place && g.place.found ? g.place : null;
  const s = {};
  // 교통: 역 도보(5분 이하 100 ~ 20분 0) + 출근(30분 이하 100 ~ 80분 0)
  const parts = [];
  if (p && p.station) parts.push(lerp(p.station.walkMin, 5, 20));
  else if (p) parts.push(0);
  const avgC = avgRide(g);
  if (avgC != null) parts.push(lerp(avgC, 30, 80));
  s.traffic = parts.length ? parts.reduce((a, b) => a + b, 0) / parts.length : null;
  // 생활: 큰 마트 8곳이면 만점(60%), 백화점 3곳이면 만점(40%)
  s.life = p ? Math.min(p.marts, 8) / 8 * 60 + Math.min(p.depts, 3) / 3 * 40 : null;
  // 학군: 중학교 150m 이내 100 ~ 1km 0
  s.school = p ? (p.school ? lerp(p.school.meters, 150, 1000) : 0) : null;
  // 가격: 결과 안에서 평당가 순위
  s.price = g.priceRank;
  // 신축: 5년차 이하 100 ~ 40년차 0
  s.fresh = lerp(year - g.built + 1, 5, 40);
  // 규모: 건축물대장 세대수 (1,000세대 이상 100 ~ 100세대 0)
  // K-apt(공동주택관리정보시스템)는 보통 150세대 이상 단지만 등록돼 있어서, 못 찾으면 소규모 단지로 봐요
  const hh = g.kapt?.households;
  s.size = hh ? lerp(hh, 1000, 100) : g.kapt?.found === false ? 0 : null;
  let sum = 0, w = 0;
  for (const c of CATS) if (s[c.k] != null && weights[c.k] > 0) { sum += s[c.k] * weights[c.k]; w += weights[c.k]; }
  // 주변 정보를 못 찾은 단지는 종합 점수를 매기지 않아요 (가격·신축만으로 높게 나오는 걸 막으려고)
  s.total = p && w ? Math.round(sum / w) : null;
  return s;
}
const grade = (v) => v == null ? "-" : v >= 85 ? "S" : v >= 70 ? "A" : v >= 50 ? "B" : "C";
const gradeNum = { S: 3, A: 2, B: 1, C: 0, "-": -1 };

function build(lists) {
  const min = parseFloat($("min").value || 0) * 10000;
  const max = parseFloat($("max").value || 999) * 10000;
  const area = parseFloat($("area").value);
  const map = new Map();
  for (const l of lists) {
    const gu = GU_NAME[l.code];
    for (const t of l.trades) {
      if (t.price < min || t.price > max || t.area < area) continue;
      const k = `${gu}|${t.apt}|${t.dong}|${t.jibun}`;
      if (!map.has(k)) map.set(k, { id: map.size, gu, apt: t.apt, dong: t.dong, jibun: t.jibun, built: t.built, deals: [] });
      map.get(k).deals.push(t);
    }
  }
  groups = [...map.values()].map((g) => {
    g.deals.sort((a, b) => b.date.localeCompare(a.date));
    g.latest = g.deals[0];
    g.low = Math.min(...g.deals.map((d) => d.price));
    g.high = Math.max(...g.deals.map((d) => d.price));
    g.sizes = [...new Set(g.deals.map((d) => pyeong(d.area)))].sort((a, b) => a - b);
    g.ppp = g.latest.price / (g.latest.area / 3.3058); // 전용 평당 가격
    return g;
  });
  // 가격 점수: 평당가가 낮은 순으로 100 → 0
  const byP = [...groups].sort((a, b) => a.ppp - b.ppp);
  byP.forEach((g, i) => g.priceRank = byP.length > 1 ? 100 * (1 - i / (byP.length - 1)) : 100);

  works = $("work").value.split(/[,，·\/]/).map((x) => x.trim()).filter(Boolean).slice(0, 3);
  workPlace = works.join(", ");
  store.set("work", $("work").value);
  openIds.clear();
  renderAll();
  const places = loadPlaces().then(() => { renderAll(); loadCommute(); });
  Promise.all([loadComplex(), places]).then(loadNearHH);
}

function priceChart(deals) {
  const ds = [...deals].sort((a, b) => a.date.localeCompare(b.date));
  if (ds.length < 2) return `<p class="muted" style="font-size:13px">거래가 1건이라 추이를 그릴 수 없어요.</p>`;
  const W = 680, H = 150, P = { l: 52, r: 12, t: 12, b: 24 };
  const t = ds.map((d) => new Date(d.date).getTime()), v = ds.map((d) => d.price);
  const t0 = Math.min(...t), t1 = Math.max(...t), v0 = Math.min(...v), v1 = Math.max(...v);
  const pad = (v1 - v0) * 0.15 || v0 * 0.05;
  const X = (x) => P.l + (t1 === t0 ? 0.5 : (x - t0) / (t1 - t0)) * (W - P.l - P.r);
  const Y = (y) => P.t + (1 - (y - (v0 - pad)) / (v1 - v0 + 2 * pad)) * (H - P.t - P.b);
  const pts = ds.map((d, i) => `${X(t[i]).toFixed(1)},${Y(d.price).toFixed(1)}`);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="실거래가 추이">
    ${[v1, (v0 + v1) / 2, v0].map((y) => `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(y)}" y2="${Y(y)}" stroke="#e5e7eb"/>
      <text x="${P.l - 6}" y="${Y(y) + 4}" text-anchor="end" font-size="11" fill="#6b7280">${(y / 10000).toFixed(1)}억</text>`).join("")}
    <polyline points="${pts.join(" ")}" fill="none" stroke="#2563eb" stroke-width="2"/>
    ${ds.map((d, i) => `<circle cx="${X(t[i])}" cy="${Y(d.price)}" r="3.5" fill="#2563eb"><title>${d.date} · ${won(d.price)} · ${pyeong(d.area)}평 ${d.floor}층</title></circle>`).join("")}
    <text x="${P.l}" y="${H - 6}" font-size="11" fill="#6b7280">${ds[0].date.slice(0, 7)}</text>
    <text x="${W - P.r}" y="${H - 6}" font-size="11" fill="#6b7280" text-anchor="end">${ds[ds.length - 1].date.slice(0, 7)}</text>
  </svg>`;
}

// ---- 건축물대장 (세대수·용적률·건폐율) ----
function bldHtml(g) {
  const parts = [];
  if (g.kapt?.households) parts.push(`${g.kapt.households.toLocaleString()}세대`);
  else if (g.kapt?.found === false) parts.push(`소규모 단지(관리정보 미등록)`);
  const b = g.place?.building;
  if (b && !b.error && b.far) { parts.push(`용적률 ${b.far}%`); if (b.bcr) parts.push(`건폐율 ${b.bcr}%`); }
  return parts.length ? " · " + parts.join(" · ") : "";
}
const GU_CODE = Object.fromEntries(GU.map(([n, c]) => [n, c]));
// ---- 단지 세대수 (K-apt) ----
// 구마다 단지 목록을 한 번 받아서 여기서 이름을 맞추고, 맞춘 단지만 하나씩 천천히 세대수를 물어봐요.
// 실거래가 단지명과 K-apt 단지명은 표기가 달라요. 예) "상계주공7(고층)" ↔ "상계주공7단지", "한신4차" ↔ "한신(4차)"
const kClean = (s) => s.replace(/아파트|APT|apt/g, "").replace(/단지/g, "").replace(/[^0-9a-zA-Z가-힣]/g, "");
function kForms(s) {
  const inner = (s.match(/\((.*?)\)/g) || []).map((x) => x.slice(1, -1)).join("");
  return [...new Set([kClean(s.replace(/\(.*?\)/g, "")), kClean(inner), kClean(s)].filter((x) => x.length >= 2))];
}
const kDigits = (s) => (s.match(/\d+/g) || []).join(",");
function kDice(a, b) {
  const bi = (s) => { const r = []; for (let i = 0; i < s.length - 1; i++) r.push(s.slice(i, i + 2)); return r; };
  const A = bi(a), B = bi(b); if (!A.length || !B.length) return 0;
  let hit = 0; const pool = [...B];
  for (const x of A) { const i = pool.indexOf(x); if (i >= 0) { hit++; pool.splice(i, 1); } }
  return (2 * hit) / (A.length + B.length);
}
function kPair(a, b) {
  const da = kDigits(a), db = kDigits(b); let pen = 1;
  if (da !== db) { if (da && db) return 0; pen = 0.8; }  // 번호가 둘 다 있는데 다르면 다른 단지
  if (a === b) return pen;
  const [s, l] = a.length < b.length ? [a, b] : [b, a];
  if (l.includes(s)) return 0.9 * pen * Math.min(1, (s.length / l.length) * 1.5); // 짧은 이름이 긴 이름에 '우연히' 들어간 경우는 감점
  return kDice(a, b) * pen;
}
function kMatch(list, dong, name) {
  const T = kForms(name);
  const score = (c) => { let b = 0; for (const x of T) for (const y of kForms(c.n)) b = Math.max(b, kPair(x, y)); return b; };
  const pick = (cands, need) => { let best = null, bs = 0; for (const c of cands) { const v = score(c); if (v > bs) { best = c; bs = v; } } return bs >= need ? best : null; };
  // 같은 동에서 먼저 찾고, 없으면 구 전체에서 거의 똑같은 이름만 인정
  return pick(list.filter((c) => c.d === dong), 0.6) || pick(list, 0.95);
}
const kLists = {}; // 구 코드 → 단지 목록 (이번 화면에서 기억)
const kInfo = store.get("kinfo", {}); // 단지 코드 → 세대수 (브라우저에 기억, 세대수는 거의 안 바뀌어요)
function getKList(gc) {
  if (!kLists[gc]) kLists[gc] = fetch(`/api/complex?gu=${gc}`).then((r) => r.json()).then((r) => r.list || null).catch(() => null);
  return kLists[gc];
}
// 공공데이터포털이 빠른 요청을 거절할 수 있어서 하나씩, 실패하면 잠깐 쉬었다가 다시 물어봐요
async function fetchKInfo(c) {
  if (kInfo[c]) return kInfo[c];
  for (let i = 0; i < 3; i++) {
    try {
      const r = await fetch(`/api/complex?code=${c}`);
      const d = await r.json();
      if (r.ok) { kInfo[c] = { households: d.households, buildings: d.buildings }; store.set("kinfo", kInfo); break; }
    } catch {}
    await new Promise((ok) => setTimeout(ok, 1200 * (i + 1)));
  }
  await new Promise((ok) => setTimeout(ok, 150));
  return kInfo[c];
}
async function loadComplex() {
  const token = runToken;
  const codes = [...new Set(groups.map((g) => GU_CODE[g.gu]))];
  for (const gc of codes) await getKList(gc);
  if (token !== runToken) return;
  for (const g of groups) {
    const list = await getKList(GU_CODE[g.gu]);
    if (!list) { g.kapt = { error: true }; continue; }
    const hit = kMatch(list, g.dong, g.apt);
    g.kapt = hit ? { found: true, kaptCode: hit.c, kaptName: hit.n, ...(kInfo[hit.c] || {}) } : { found: false };
  }
  scheduleRender();
  const need = groups.filter((g) => g.kapt.found && g.kapt.households === undefined);
  await runQueue(need, 1, async (g) => {
    const c = g.kapt.kaptCode;
    await fetchKInfo(c);
    // 같은 단지 코드를 쓰는 다른 카드도 채워요
    for (const x of groups) if (x.kapt?.kaptCode === c && kInfo[c]) Object.assign(x.kapt, kInfo[c]);
  });
}

// ---- 1km 안 세대수 합계 ----
// 카카오에서 받은 주변 아파트 이름을 K-apt 단지 목록과 맞춰서, 각 단지 세대수를 더해요.
// 처음엔 시간이 좀 걸리지만, 세대수는 브라우저에 기억해 둬서 다음부터는 바로 나와요.
async function loadNearHH() {
  const token = runToken;
  const order = [...groups].sort((a, b) => (b.s?.total ?? -1) - (a.s?.total ?? -1)); // 점수 높은 단지부터
  for (const g of order) {
    const list = g.place?.apts?.list;
    if (!list) continue;
    const codes = new Set();
    for (const [n, , addr] of list) {
      const parts = String(addr).split(" ");
      const gc = GU_CODE[parts[1]];
      if (!gc || parts[0] !== "서울") continue;
      const kl = await getKList(gc);
      const hit = kl && kMatch(kl, parts[2], n);
      if (hit) codes.add(hit.c);
    }
    g.nearCodes = [...codes];
    g.nearTotal = list.length;
  }
  if (token !== runToken) return;
  const sumUp = (g) => {
    if (!g.nearCodes) return;
    const known = g.nearCodes.filter((c) => kInfo[c]);
    g.nearHH = { done: known.length === g.nearCodes.length, matched: g.nearCodes.length, total: g.nearTotal,
      sum: known.reduce((s, c) => s + (kInfo[c].households || 0), 0) };
  };
  groups.forEach(sumUp); scheduleRender();
  for (const g of order) {
    if (!g.nearCodes || g.nearHH?.done) continue;
    for (const c of g.nearCodes) { if (token !== runToken) return; await fetchKInfo(c); }
    groups.forEach(sumUp); scheduleRender();
  }
}

// ---- 주변 정보 (카카오맵) ----
const walk = (g) => g.place?.station ? g.place.station.walkMin : 999;
function nearHtml(g) {
  const p = g.place;
  if (p === undefined) return `<span class="muted">주변 정보 불러오는 중…</span>`;
  if (!p || p.none || p.error || !p.found) return p?.none ? "" : `<span class="muted">주변 정보를 찾지 못했어요</span>`;
  const st = p.station ? `<span><b>${esc(p.station.name)}</b> 도보 약 ${p.station.walkMin}분</span>` : `<span class="muted">3km 안 지하철역 없음</span>`;
  const sc = p.school ? `<span>${esc(p.school.name)} ${p.school.meters.toLocaleString()}m</span>` : `<span class="muted">3km 안 중학교 없음</span>`;
  return `${st}<span>마트 <b>${p.marts}</b> · 백화점 <b>${p.depts}</b></span>${sc}`;
}

async function runQueue(items, size, job) {
  const token = runToken; const queue = [...items];
  await Promise.all(Array.from({ length: size }, async () => {
    while (queue.length && token === runToken) { const g = queue.shift(); if (await job(g) === "stop") queue.length = 0; scheduleRender(); }
  }));
}
const addrOf = (g) => `서울 ${g.gu} ${g.dong} ${g.jibun}`.trim();

function loadPlaces() {
  return runQueue(groups, 6, async (g) => {
    try { g.place = await (await fetch(`/api/places?addr=${encodeURIComponent(addrOf(g))}&name=${encodeURIComponent(g.apt)}`)).json(); }
    catch { g.place = { error: true }; }
  });
}

// ---- 출근 시간 (카카오 대중교통) ----
// 출근지가 여러 곳이면 g.commutes = { "강남역": {found, minutes, ...}, ... } 로 따로 저장하고 평균을 써요.
function avgRide(g) {
  const v = works.map((w) => g.commutes?.[w]).filter((c) => c && c.found).map((c) => c.minutes);
  return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : null;
}
const ride = (g) => avgRide(g) ?? 9999;
// 카카오 대중교통 무료 조회량이 넉넉하지 않아서(하루 1,000번), 결과를 이 브라우저에 30일 기억해 두고
// 처음에는 종합 점수 상위 AUTO_N개 단지만 자동으로 계산해요. 나머지는 '계산하기'를 누르면 해요.
const AUTO_N = 20;
const DAY = 86400000;
let quotaHit = false;
const cKey = (g, w) => `c:${addrOf(g)}|${g.apt}|${w}`;
function cached(g, w) {
  const hit = store.get(cKey(g, w), null);
  return hit && Date.now() - hit.t < 30 * DAY ? hit.d : null;
}
async function fetchCommute(g, w) {
  g.commutes = g.commutes || {};
  const hit = cached(g, w);
  if (hit) { g.commutes[w] = hit; return; }
  if (quotaHit) { g.commutes[w] = { quota: true }; return; }
  g.commutes[w] = "wait"; scheduleRender();
  let r;
  try {
    r = await (await fetch(`/api/commute?addr=${encodeURIComponent(addrOf(g))}&name=${encodeURIComponent(g.apt)}&to=${encodeURIComponent(w)}`)).json();
  } catch { r = { found: false }; }
  g.commutes[w] = r;
  if (r.quota) quotaHit = true;
  else if (r.found || r.reason) store.set(cKey(g, w), { t: Date.now(), d: r });
}
function loadCommute() {
  if (!works.length) return;
  quotaHit = false;
  // 이미 기억해 둔 결과는 전부 바로 채워요 (조회량 안 씀)
  for (const g of groups) for (const w of works) { const h = cached(g, w); if (h) (g.commutes = g.commutes || {})[w] = h; }
  const top = [...groups].sort((a, b) => (b.s?.total ?? -1) - (a.s?.total ?? -1)).slice(0, AUTO_N);
  const jobs = [];
  for (const g of top) for (const w of works) if (g.commutes?.[w] === undefined) jobs.push({ g, w });
  return runQueue(jobs, 3, async ({ g, w }) => { await fetchCommute(g, w); if (quotaHit) return "stop"; });
}
document.addEventListener("click", async (e) => {
  const a = e.target.closest("[data-ask]"); if (!a) return;
  e.preventDefault(); e.stopPropagation();
  const g = groups.find((x) => x.id === +a.dataset.ask);
  if (!g) return;
  for (const w of works) if (g.commutes?.[w] === undefined || g.commutes[w].quota) { delete (g.commutes || {})[w]; await fetchCommute(g, w); scheduleRender(); }
});

// ---- 앱처럼 설치 (서비스 워커 등록) ----
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
}
</script>
