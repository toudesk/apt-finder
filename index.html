<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>내 아파트 찾기</title>
<meta name="theme-color" content="#2563eb" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icon-192.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="아파트찾기" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1a1d23; --sub: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --accent-soft: #eff4ff; --warn-bg: #fff7e6; --warn: #92580a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Noto Sans KR", system-ui, sans-serif; font-size: 15px; line-height: 1.5; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .lead { color: var(--sub); margin: 0 0 20px; }

  .filters { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--sub); font-weight: 500; }
  select, input { font: inherit; padding: 9px 10px; border: 1px solid var(--line); border-radius: 9px;
    background: #fff; color: var(--text); width: 100%; }
  button.go { grid-column: 1 / -1; font: inherit; font-weight: 700; padding: 12px; border: 0;
    border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
  button.go:disabled { opacity: .6; cursor: wait; }

  .notice { margin: 16px 0 0; padding: 10px 14px; border-radius: 10px; background: var(--warn-bg);
    color: var(--warn); font-size: 14px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin: 22px 0 10px; }
  .bar strong { font-size: 17px; }
  .bar select { width: auto; }

  .apt { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
  .apt-head { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 14px 16px; cursor: pointer; }
  .apt-head:hover { background: #fafbfc; }
  .name { font-weight: 700; font-size: 16px; }
  .meta { color: var(--sub); font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
  .price { text-align: right; }
  .price b { font-size: 18px; display: block; }
  .price span { font-size: 12px; color: var(--sub); }
  .deals { display: none; border-top: 1px solid var(--line); padding: 6px 16px 12px; }
  .apt.open .deals { display: block; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 7px 4px; text-align: left; border-bottom: 1px solid var(--line); }
  th { color: var(--sub); font-weight: 500; font-size: 12px; }
  td.r, th.r { text-align: right; }
  .near { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 8px; font-size: 13px; color: var(--text); }
  .near .muted { color: var(--sub); }
  .near b { font-weight: 500; }
  .empty { text-align: center; color: var(--sub); padding: 40px 0; }
  footer { margin-top: 30px; font-size: 12px; color: var(--sub); }
</style>
</head>
<body>
<div class="wrap">
  <h1>내 아파트 찾기</h1>
  <p class="lead">구와 예산을 고르면 최근 실거래된 아파트를 단지별로 모아 보여드려요.</p>

  <form class="filters" id="f">
    <label>구
      <select id="gu"></select>
    </label>
    <label>기간
      <select id="months">
        <option value="3">최근 3개월</option>
        <option value="6">최근 6개월</option>
        <option value="12">최근 1년</option>
      </select>
    </label>
    <label>최소 예산 (억)
      <input id="min" type="number" step="0.5" min="0" value="5" />
    </label>
    <label>최대 예산 (억)
      <input id="max" type="number" step="0.5" min="0" value="6" />
    </label>
    <label>크기 (전용면적)
      <select id="area">
        <option value="0">전체</option>
        <option value="39">39㎡ 이상 (16평형대~)</option>
        <option value="49">49㎡ 이상 (20평형대~)</option>
        <option value="59">59㎡ 이상 (24평형대~)</option>
        <option value="84">84㎡ 이상 (32평형대~)</option>
      </select>
    </label>
    <label>출근지 (선택)
      <input id="work" list="work-list" placeholder="예: 강남역, 회사 이름" autocomplete="off" />
      <datalist id="work-list">
        <option value="강남역"></option><option value="시청역"></option><option value="여의도역"></option>
        <option value="광화문역"></option><option value="삼성역"></option><option value="종각역"></option>
        <option value="판교역"></option><option value="구로디지털단지역"></option><option value="마곡나루역"></option>
      </datalist>
    </label>
    <button class="go" id="go" type="submit">찾아보기</button>
  </form>

  <div id="notice"></div>
  <div id="result"></div>

  <footer>데이터: 국토교통부 아파트 매매 실거래가 (공공데이터포털). 취소된 거래는 뺐어요. 출근 시간은 카카오맵 대중교통 경로로, 조회한 시각 기준이라 실제 출근 시간대와 다를 수 있어요. 참고용이니 실제 매물·가격은 꼭 직접 확인하세요.</footer>
</div>

<script>
const GU = [["종로구","11110"],["중구","11140"],["용산구","11170"],["성동구","11200"],["광진구","11215"],
  ["동대문구","11230"],["중랑구","11260"],["성북구","11290"],["강북구","11305"],["도봉구","11320"],
  ["노원구","11350"],["은평구","11380"],["서대문구","11410"],["마포구","11440"],["양천구","11470"],
  ["강서구","11500"],["구로구","11530"],["금천구","11545"],["영등포구","11560"],["동작구","11590"],
  ["관악구","11620"],["서초구","11650"],["강남구","11680"],["송파구","11710"],["강동구","11740"]];

const $ = (id) => document.getElementById(id);
$("gu").innerHTML = GU.map(([n, c]) => `<option value="${c}" ${c === "11350" ? "selected" : ""}>${n}</option>`).join("");

let groups = [];

function won(man) { // 만원 → "5억 1,500"
  const eok = Math.floor(man / 10000), rest = man % 10000;
  if (!eok) return `${rest.toLocaleString()}만`;
  return rest ? `${eok}억 ${rest.toLocaleString()}` : `${eok}억`;
}
const pyeong = (m2) => Math.round(m2 / 3.3058);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("go");
  btn.disabled = true; btn.textContent = "불러오는 중…";
  $("notice").innerHTML = "";
  try {
    const r = await fetch(`/api/trades?gu=${$("gu").value}&months=${$("months").value}`);
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "불러오지 못했어요.");
    if (data.demo) $("notice").innerHTML = `<p class="notice">지금은 <b>예시 데이터</b>예요. API 키를 설정하면 실제 실거래가가 나와요.</p>`;
    build(data.trades);
  } catch (err) {
    $("result").innerHTML = `<p class="empty">${esc(err.message)}</p>`;
  } finally {
    btn.disabled = false; btn.textContent = "찾아보기";
  }
});

function build(trades) {
  const min = parseFloat($("min").value || 0) * 10000;
  const max = parseFloat($("max").value || 999) * 10000;
  const area = parseFloat($("area").value);
  const ok = trades.filter((t) => t.price >= min && t.price <= max && t.area >= area);

  const map = new Map();
  for (const t of ok) {
    const k = `${t.apt}|${t.dong}|${t.jibun}`;
    if (!map.has(k)) map.set(k, { id: map.size, apt: t.apt, dong: t.dong, jibun: t.jibun, built: t.built, deals: [] });
    map.get(k).deals.push(t);
  }
  groups = [...map.values()].map((g) => {
    g.deals.sort((a, b) => b.date.localeCompare(a.date));
    g.latest = g.deals[0];
    g.low = Math.min(...g.deals.map((d) => d.price));
    g.high = Math.max(...g.deals.map((d) => d.price));
    g.sizes = [...new Set(g.deals.map((d) => pyeong(d.area)))].sort((a, b) => a - b);
    return g;
  });
  workPlace = $("work").value.trim();
  render("count");
  loadPlaces();
  loadCommute();
}

function render(sort) {
  const sorters = {
    count: (a, b) => b.deals.length - a.deals.length,
    low: (a, b) => a.latest.price - b.latest.price,
    high: (a, b) => b.latest.price - a.latest.price,
    new: (a, b) => b.built - a.built,
    recent: (a, b) => b.latest.date.localeCompare(a.latest.date),
    station: (a, b) => walk(a) - walk(b),
    commute: (a, b) => ride(a) - ride(b),
  };
  groups.sort(sorters[sort]);
  const guName = $("gu").selectedOptions[0].text;
  const year = new Date().getFullYear();

  if (!groups.length) {
    $("result").innerHTML = `<p class="empty">조건에 맞는 거래가 없어요. 예산이나 기간을 넓혀 보세요.</p>`;
    return;
  }
  $("result").innerHTML = `
    <div class="bar">
      <strong>${esc(guName)} · ${groups.length}개 단지</strong>
      <select id="sort">
        <option value="count">거래 많은 순</option>
        <option value="recent">최근 거래 순</option>
        <option value="low">가격 낮은 순</option>
        <option value="high">가격 높은 순</option>
        <option value="new">신축 순</option>
        <option value="station">역 가까운 순</option>
        ${workPlace ? `<option value="commute">출근 짧은 순</option>` : ""}
      </select>
    </div>
    ${groups.map((g, i) => `
      <div class="apt" data-i="${i}">
        <div class="apt-head">
          <div>
            <div class="name">${esc(g.apt)}</div>
            <div class="meta">${esc(g.dong)} · ${g.built}년 준공 (${year - g.built + 1}년차)</div>
            <div class="chips">
              <span class="chip">거래 ${g.deals.length}건</span>
              <span class="chip">전용 ${g.sizes.join("·")}평</span>
            </div>
            <div class="near" id="near-${g.id}">${nearHtml(g)}</div>
            ${workPlace ? `<div class="near" id="work-${g.id}">${commuteHtml(g)}</div>` : ""}
          </div>
          <div class="price">
            <b>${won(g.latest.price)}</b>
            <span>최근 ${g.latest.date.slice(5).replace("-", ".")}</span><br/>
            <span>${g.low === g.high ? "" : `${won(g.low)} ~ ${won(g.high)}`}</span>
          </div>
        </div>
        <div class="deals">
          <table>
            <tr><th>거래일</th><th>전용면적</th><th>층</th><th class="r">가격</th></tr>
            ${g.deals.map((d) => `<tr><td>${d.date}</td><td>${d.area}㎡ (${pyeong(d.area)}평)</td><td>${d.floor}층</td><td class="r">${won(d.price)}</td></tr>`).join("")}
          </table>
        </div>
      </div>`).join("")}`;
  $("sort").value = sort;
  $("sort").onchange = (e) => render(e.target.value);
  document.querySelectorAll(".apt-head").forEach((h) => h.onclick = () => h.parentElement.classList.toggle("open"));
}

// ---- 2단계: 카카오맵 주변 정보 ----
const walk = (g) => g.place?.station ? g.place.station.walkMin : 999;

function nearHtml(g) {
  const p = g.place;
  if (p === undefined) return `<span class="muted">주변 정보 불러오는 중…</span>`;
  if (!p || p.none || p.error || !p.found) return p?.none ? "" : `<span class="muted">주변 정보를 찾지 못했어요</span>`;
  const st = p.station
    ? `<span><b>${esc(p.station.name)}</b> 도보 약 ${p.station.walkMin}분</span>`
    : `<span class="muted">3km 안 지하철역 없음</span>`;
  return `${st}<span>대형마트 <b>${p.marts}</b> · 백화점 <b>${p.depts}</b> <span class="muted">(3km 안)</span></span>`;
}

let loadToken = 0;
async function loadPlaces() {
  const token = ++loadToken; // 새로 검색하면 이전 불러오기는 멈춰요
  const guName = $("gu").selectedOptions[0].text;
  const queue = [...groups];
  const worker = async () => {
    while (queue.length && token === loadToken) {
      const g = queue.shift();
      try {
        const addr = `서울 ${guName} ${g.dong} ${g.jibun}`.trim();
        const r = await fetch(`/api/places?addr=${encodeURIComponent(addr)}&name=${encodeURIComponent(g.apt)}`);
        g.place = await r.json();
      } catch { g.place = { error: true }; }
      if (token !== loadToken) return;
      const el = document.getElementById(`near-${g.id}`);
      if (el) el.innerHTML = nearHtml(g);
    }
  };
  await Promise.all(Array.from({ length: 6 }, worker));
}

// ---- 4단계: 출근 시간 (카카오 대중교통 경로) ----
let workPlace = "";
let commuteToken = 0;
const ride = (g) => (g.commute?.found ? g.commute.minutes : 9999);

function commuteHtml(g) {
  const c = g.commute;
  if (c === undefined) return `<span class="muted">${esc(workPlace)}까지 출근 시간 계산 중…</span>`;
  if (c.quota) return `<span class="muted">오늘 출근 시간 무료 조회량을 다 썼어요. 내일 다시 볼 수 있어요.</span>`;
  if (!c.found) return c.none ? "" : `<span class="muted">${esc(workPlace)}까지 대중교통 경로를 찾지 못했어요</span>`;
  const tr = c.transfers == null ? "" : c.transfers === 0 ? " · 환승 없음" : ` · 환승 ${c.transfers}회`;
  return `<span>${esc(c.dest || workPlace)}까지 대중교통 <b>약 ${c.minutes}분</b>${tr}</span>`;
}

async function loadCommute() {
  const token = ++commuteToken;
  if (!workPlace) return;
  const guName = $("gu").selectedOptions[0].text;
  const queue = [...groups];
  let stop = false;
  const worker = async () => {
    while (queue.length && token === commuteToken && !stop) {
      const g = queue.shift();
      try {
        const addr = `서울 ${guName} ${g.dong} ${g.jibun}`.trim();
        const r = await fetch(`/api/commute?addr=${encodeURIComponent(addr)}&name=${encodeURIComponent(g.apt)}&to=${encodeURIComponent(workPlace)}`);
        g.commute = await r.json();
        if (g.commute.quota) stop = true; // 무료 조회량이 끝나면 더 부르지 않아요
      } catch { g.commute = { found: false }; }
      if (token !== commuteToken) return;
      const el = document.getElementById(`work-${g.id}`);
      if (el) el.innerHTML = commuteHtml(g);
    }
    if (stop) for (const g of queue.splice(0)) {
      g.commute = { quota: true };
      const el = document.getElementById(`work-${g.id}`);
      if (el) el.innerHTML = commuteHtml(g);
    }
  };
  await Promise.all(Array.from({ length: 4 }, worker));
}

// ---- 앱처럼 설치 (서비스 워커 등록) ----
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
}
</script>
</body>
</html>
